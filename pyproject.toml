[tool.poetry]
name = "oculith"
version = "0.2.0"
description = "Document OCR based on docling"
authors = ["arcstep <43801@qq.com>"]
readme = "README.md"
packages = [
    { include = "oculith", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
docling = ">=2.30.0"
voidrail = {path = "../voidrail", develop = true}
celery = "^5.5.2"
redis = ">=6.0.0,<7.0.0"
click = "^8.1.8"
tiktoken = "^0.9.0"
tesserocr = "^2.8.0"
ocrmac = "^1.0.0"
pypdf = "^5.5.0"
# 锁定关键的ML库版本以确保稳定性
torch = ">=2.2.0,<2.4.0"
transformers = ">=4.42.0,<4.43.0"
tokenizers = "0.19.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pypdf2 = "^3.0.1"
pdfminer = {extras = ["high-level"], version = "^20191125"}
pdfplumber = "^0.11.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
oculith = "oculith.__main__:main"
